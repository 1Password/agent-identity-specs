name: Build and publish drafts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@97ecb7b512899eb71ab1bf2310a624c6f1589ac6 # v1.308.0
        with:
          ruby-version: '3.3'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          gem install kramdown-rfc
          python -m pip install xml2rfc

      - name: Build drafts
        run: make all xml

      - name: Stage site
        run: |
          mkdir -p _site
          cp -r assets _site/assets
          cp draft-*.html draft-*.txt draft-*.xml _site/
          bash scripts/gen-index.sh > _site/index.html

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: drafts
          path: |
            draft-*.xml
            draft-*.html
            draft-*.txt

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
