name: Build and publish drafts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: ruby/setup-ruby@97ecb7b512899eb71ab1bf2310a624c6f1589ac6 # v1.308.0
        with:
          ruby-version: '3.3'

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          gem install kramdown-rfc -v 1.7.39
          python -m pip install xml2rfc==3.34.0

      - name: Build drafts
        run: make all xml

      - name: Stage site
        run: |
          mkdir -p _site
          cp -r assets _site/assets
          cp draft-*.html draft-*.txt draft-*.xml _site/
          bash scripts/gen-index.sh > _site/index.html

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: drafts
          path: |
            draft-*.xml
            draft-*.html
            draft-*.txt

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  lint:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download built drafts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: drafts

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Run idnits
        run: |
          for f in draft-*.txt; do
            echo "::group::idnits $f"
            npx --yes @ietf-tools/idnits --offline "$f"
            echo "::endgroup::"
          done

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [build, lint]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
